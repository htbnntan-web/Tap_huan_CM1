  <head>
    <meta charset="UTF-8" />

    <title>Hệ Thống Slide Chuyên Môn Giáo Dục Phổ Thông</title>
    <meta name="description" content="Bài trình chiếu chuyên nghiệp tổng hợp quy trình xây dựng Kế hoạch dạy học (CV 5512), Đổi mới KHBD, Tích hợp giáo dục (CV 5208), Khung năng lực số (TT 02/2025), Sinh hoạt chuyên môn NCBH (CV 5555) và Quản lý hồ sơ điện tử (TT 15/2026)." />
    <meta property="og:title" content="Hệ Thống Slide Chuyên Môn Giáo Dục Phổ Thông" />
    <meta property="og:description" content="Bài trình chiếu chuyên nghiệp tổng hợp quy trình xây dựng Kế hoạch dạy học (CV 5512), Đổi mới KHBD, Tích hợp giáo dục (CV 5208), Khung năng lực số (TT 02/2025), Sinh hoạt chuyên môn NCBH (CV 5555) và Quản lý hồ sơ điện tử (TT 15/2026)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var currentFetch = originalFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (newFetch) {
                if (typeof newFetch === 'function') {
                  currentFetch = newFetch;
                }
              }
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              (event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
              (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
